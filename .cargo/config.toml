# Intentionally minimal.
#
# All target-specific build wiring (linker, -static, relocation model, and on
# nightly the -Z build-std flags) is injected by the `./x` wrapper, scoped to
# the *active* target triple via CARGO_TARGET_<TRIPLE>_{LINKER,RUSTFLAGS}.
#
# Why not put it here? The nightly path pulls in `compiler_builtins`, whose
# build script must compile for the host (-gnu, with the system `cc`). If the
# freestanding linker flags were keyed to a triple the host also builds for,
# they would break that build script. Keeping them out of this file — and using
# a distinct target triple per path (see ./x) — avoids the collision.
#
# Build through ./x, not bare cargo:  ./x build   /   ./x build --nightly
