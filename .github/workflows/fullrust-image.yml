name: fullrust image

# Build ghcr.io/<owner>/fullrust and push it, tagged with the Rust minor and
# `latest`. The image just repackages the prebuilt stage1 (a release asset from
# the `fullrust toolchain` workflow) plus the ecosystem bundle, so this is fast —
# it runs on every ecosystem change without rebuilding the compiler. Mirrors
# KarpelesLab/decryptd's Docker workflow (build-push-action off a release asset).
#
# Triggers: manual; after a new toolchain release; and when the ecosystem
# bundle / docker files change on master.

on:
  workflow_dispatch:
    inputs:
      minor:
        description: "Rust minor to package (must have a toolchain-<minor> release)"
        required: false
        default: "1.88"
        type: string
  workflow_run:
    workflows: ["fullrust toolchain"]
    types: [completed]
  push:
    branches: [master]
    paths:
      - "toolchain/fullrust-ecosystem/**"
      - "toolchain/docker/**"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build & push to GHCR
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version, tags, and toolchain asset URL
        id: meta
        run: |
          minor="${{ inputs.minor || '1.88' }}"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"      # GHCR names are lowercase
          echo "tags=${repo}:${minor},${repo}:latest" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/toolchain-${minor}/fullrust-toolchain-${minor}-x86_64.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: toolchain
          file: toolchain/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            FULLRUST_TOOLCHAIN_URL=${{ steps.meta.outputs.url }}

  # Prove the published image actually compiles AND runs a fullrust binary — the
  # real end-to-end check the build-time smoke test can't do (it can't run cargo
  # against the target). Exercises the exact consumer path: `docker run <img>
  # build --release` on a fresh crate, then asserts the output is a static,
  # libc-free ELF and executes it on the stock runner.
  verify:
    name: verify image builds & runs a fullrust binary
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, inspect, and run a hello-world via the image
        run: |
          set -euxo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          minor="${{ inputs.minor || '1.88' }}"
          mkdir -p proj/src
          printf '[package]\nname = "hello"\nversion = "0.0.0"\nedition = "2021"\n\n[[bin]]\nname = "hello"\npath = "src/main.rs"\n' > proj/Cargo.toml
          printf 'fn main() { println!("hello from fullrust"); }\n' > proj/src/main.rs

          # Build exactly as a consumer would (the composite action's docker-run path).
          docker run --rm -v "$PWD/proj:/src" "${repo}:${minor}" build --release

          bin="proj/target/x86_64-unknown-linux-fullrust/release/hello"
          test -f "$bin"
          file "$bin"
          file "$bin" | grep -q 'statically linked'
          # A libc-free static binary must declare no dynamic dependencies.
          if readelf -d "$bin" 2>/dev/null | grep -qi NEEDED; then
            echo "::error::binary has dynamic NEEDED deps — not libc-free"; readelf -d "$bin" | grep NEEDED; exit 1
          fi
          # It's a self-contained static ELF making raw syscalls — runs on a stock host.
          out="$(./"$bin")"
          echo "ran fullrust binary → $out"
          [ "$out" = "hello from fullrust" ]
          echo "OK: image builds a static, libc-free fullrust binary that runs"
