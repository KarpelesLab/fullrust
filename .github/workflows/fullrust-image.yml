name: fullrust image

# Build ghcr.io/<owner>/fullrust and push it. The image just repackages the
# prebuilt stage1 (a release asset from the `fullrust toolchain` workflow) plus
# the ecosystem bundle, so this is fast — it runs on every ecosystem change
# without rebuilding the compiler. Mirrors KarpelesLab/decryptd's Docker workflow
# (build-push-action off a release asset).
#
# Tags, per Rust minor:
#   <minor>            moving — always the newest build for that minor
#   <minor>-<sha>      immutable — pin this (or a digest) for reproducible builds
#   latest             moving — the newest build of the highest minor
#
# Triggers:
#   - dispatched by `fullrust toolchain` after it publishes a minor's asset
#     (or manually) → rebuilds that one minor;
#   - ecosystem / docker changes on master → rebuilds EVERY minor that has a
#     `toolchain-<minor>` release, since they all bundle the same ecosystem.

on:
  workflow_dispatch:
    inputs:
      minor:
        description: "Rust minor to package (blank = every minor with a toolchain-<minor> release)"
        required: false
        default: ""
        type: string
  push:
    branches: [master]
    paths:
      - "toolchain/fullrust-ecosystem/**"
      - "toolchain/docker/**"

permissions:
  contents: read
  packages: write

jobs:
  # Work out which minors to build, and which one is the highest (gets `latest`).
  plan:
    runs-on: ubuntu-latest
    outputs:
      minors: ${{ steps.plan.outputs.minors }}
      newest: ${{ steps.plan.outputs.newest }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MINOR: ${{ inputs.minor }}
        run: |
          set -euo pipefail
          all="$(gh release list -R "$GITHUB_REPOSITORY" -L 200 --json tagName -q '.[].tagName' \
                 | sed -n 's/^toolchain-//p' | sort -V)"
          [ -n "$all" ] || { echo "::error::no toolchain-<minor> releases found"; exit 1; }
          if [ -n "$INPUT_MINOR" ]; then
            grep -qxF "$INPUT_MINOR" <<<"$all" || { echo "::error::no toolchain-$INPUT_MINOR release"; exit 1; }
            minors="$INPUT_MINOR"
          else
            minors="$all"
          fi
          echo "minors=$(jq -cnR '[inputs]' <<<"$minors")" >> "$GITHUB_OUTPUT"
          echo "newest=$(tail -n1 <<<"$all")" >> "$GITHUB_OUTPUT"

  publish:
    name: build & push to GHCR (${{ matrix.minor }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minor: ${{ fromJSON(needs.plan.outputs.minors) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version, tags, and toolchain asset URL
        id: meta
        run: |
          minor="${{ matrix.minor }}"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"      # GHCR names are lowercase
          tags="${repo}:${minor},${repo}:${minor}-${GITHUB_SHA::7}"
          [ "$minor" = "${{ needs.plan.outputs.newest }}" ] && tags="${tags},${repo}:latest"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/toolchain-${minor}/fullrust-toolchain-${minor}-x86_64.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: toolchain
          file: toolchain/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.minor }}
          build-args: |
            FULLRUST_TOOLCHAIN_URL=${{ steps.meta.outputs.url }}

  # Prove the published image actually compiles AND runs a fullrust binary — the
  # real end-to-end check the build-time smoke test can't do (it can't run cargo
  # against the target). Exercises the exact consumer path: `docker run <img>
  # build --release` on a fresh crate, then asserts the output is a static,
  # libc-free ELF and executes it on the stock runner.
  verify:
    name: verify image builds & runs a fullrust binary (${{ matrix.minor }})
    needs: [plan, publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minor: ${{ fromJSON(needs.plan.outputs.minors) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, inspect, and run a proc-macro crate via the image
        run: |
          set -euxo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          # The immutable tag, so this checks exactly the image just pushed.
          minor="${{ matrix.minor }}-${GITHUB_SHA::7}"
          mkdir -p proj/src
          # A serde-derive crate on purpose: serde_derive is a PROC-MACRO and
          # serde/serde_json have BUILD SCRIPTS — both compile for the HOST, so
          # this fails ("can't find crate for std") if the image's stage1 sysroot
          # lacks host std. A dependency-free hello-world would silently pass.
          printf '[package]\nname = "probe"\nversion = "0.0.0"\nedition = "2021"\n\n[dependencies]\nserde = { version = "1", features = ["derive"] }\nserde_json = "1"\n\n[[bin]]\nname = "probe"\npath = "src/main.rs"\n' > proj/Cargo.toml
          printf 'use serde::Serialize;\n#[derive(Serialize)]\nstruct P { msg: &%sstatic str }\nfn main() { println!("{}", serde_json::to_string(&P { msg: "hello from fullrust" }).unwrap()); }\n' "'" > proj/src/main.rs

          # Build exactly as a consumer would (the composite action's docker-run path).
          docker run --rm -v "$PWD/proj:/src" "${repo}:${minor}" build --release

          bin="proj/target/x86_64-unknown-linux-fullrust/release/probe"
          test -f "$bin"
          file "$bin"
          file "$bin" | grep -q 'statically linked'
          # A libc-free static binary must declare no dynamic dependencies.
          if readelf -d "$bin" 2>/dev/null | grep -qi NEEDED; then
            echo "::error::binary has dynamic NEEDED deps — not libc-free"; readelf -d "$bin" | grep NEEDED; exit 1
          fi
          # It's a self-contained static ELF making raw syscalls — runs on a stock host.
          out="$(./"$bin")"
          echo "ran fullrust binary → $out"
          [ "$out" = '{"msg":"hello from fullrust"}' ]
          echo "OK: image compiles a proc-macro crate into a static, libc-free fullrust binary that runs"
