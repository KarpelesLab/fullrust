name: action selftest

# Proves the two ways a consumer actually builds with fullrust work end to end in
# real GitHub Actions, on a REAL proc-macro crate (serde derive — exercises host
# std + the getrandom/socket2 ecosystem [patch.crates-io]):
#   1. the composite action  `uses: KarpelesLab/fullrust`  (here `uses: ./`),
#      tested against both the oldest (1.88) and newest (1.98) published images;
#   2. a `container:` job running a raw `cargo build` (the baked env makes it a
#      fullrust build — this is the "identical build both ways" guarantee).
# Each asserts the output is a statically-linked, NEEDED-free ELF that runs.

on:
  workflow_dispatch:
  # Weekly: the ecosystem job resolves fresh from crates.io (no lockfile), so it
  # goes red as soon as an upstream release outruns a vendored fork — [patch]
  # only applies when the fork's version is the one cargo resolves.
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
  push:
    branches: [master]
    paths:
      - "action.yml"
      - "toolchain/test-ecosystem/**"
      - ".github/workflows/action-selftest.yml"
  # Changes to the image (docker/, the ecosystem forks) are tested AFTER the
  # images are rebuilt: triggering on the push itself raced the rebuild and ran
  # against the previous images, failing spuriously.
  workflow_run:
    workflows: ["fullrust image"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: read

jobs:
  composite-action:
    name: composite action (${{ matrix.image }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/karpeleslab/fullrust:1.88
          - ghcr.io/karpeleslab/fullrust:1.98
    steps:
      - uses: actions/checkout@v6

      - name: Create a real proc-macro crate
        run: |
          mkdir -p probe/src
          # `[workspace]` makes probe its own workspace root, so cargo does not walk
          # up into this repo's workspace (a test artifact — real consumers build at
          # their own repo root). Harmless for the composite job (it mounts only probe).
          printf '[package]\nname = "probe"\nversion = "0.0.0"\nedition = "2021"\n\n[[bin]]\nname = "probe"\npath = "src/main.rs"\n\n[dependencies]\nserde = { version = "1", features = ["derive"] }\nserde_json = "1"\n\n[workspace]\n' > probe/Cargo.toml
          printf 'use serde::Serialize;\n#[derive(Serialize)]\nstruct P { msg: &%sstatic str }\nfn main() { println!("{}", serde_json::to_string(&P { msg: "built by the fullrust action" }).unwrap()); }\n' "'" > probe/src/main.rs

      - name: Build via the composite action
        uses: ./
        with:
          working-directory: probe
          image: ${{ matrix.image }}
          args: --release

      - name: Assert static, libc-free, and runs
        run: |
          set -euxo pipefail
          bin=probe/target/x86_64-unknown-linux-fullrust/release/probe
          test -f "$bin"
          file "$bin" | grep -q 'statically linked'
          if readelf -l "$bin" | grep -qi interp; then echo "::error::dynamic (has PT_INTERP)"; exit 1; fi
          if readelf -d "$bin" 2>/dev/null | grep -qi needed; then echo "::error::has NEEDED deps"; exit 1; fi
          out="$(./"$bin")"
          echo "ran → $out"
          [ "$out" = '{"msg":"built by the fullrust action"}' ]

  # The vendored ecosystem forks + std::os::unix, end to end through the action:
  # tokio multi-thread TCP echo (mio + socket2 0.6), rustix mmap/getpid,
  # socket2 and std peer_cred. Resolves fresh (toolchain/test-ecosystem has no
  # committed lockfile) so a stale fork shows up here.
  ecosystem:
    name: ecosystem forks (${{ matrix.image }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/karpeleslab/fullrust:1.88
          - ghcr.io/karpeleslab/fullrust:1.98
    steps:
      - uses: actions/checkout@v6

      - name: Build via the composite action
        uses: ./
        with:
          working-directory: toolchain/test-ecosystem
          image: ${{ matrix.image }}
          args: --release

      - name: Assert every vendored fork was actually used
        working-directory: toolchain/test-ecosystem
        run: |
          set -euxo pipefail
          # [patch] silently falls back to crates.io when versions diverge; the
          # lockfile records a path source (no "source =") for patched crates.
          for c in tokio mio socket2 rustix; do
            awk -v c="$c" '$0=="name = \""c"\"" {f=1; next} f && /^source/ {print "::error::"c" came from crates.io, not the fullrust fork"; bad=1} f && /^$/ {f=0} END {exit bad}' Cargo.lock
          done

      - name: Assert static, libc-free, and runs
        working-directory: toolchain/test-ecosystem
        run: |
          set -euxo pipefail
          bin=target/x86_64-unknown-linux-fullrust/release/ecosystem-probe
          if readelf -l "$bin" | grep -qi interp; then echo "::error::dynamic (has PT_INTERP)"; exit 1; fi
          if readelf -d "$bin" 2>/dev/null | grep -qi needed; then echo "::error::has NEEDED deps"; exit 1; fi
          out="$(./"$bin")"
          echo "ran → $out"
          case "$out" in "ecosystem ok:"*) ;; *) exit 1 ;; esac

  container-job:
    name: container job (raw cargo build in :latest)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    container:
      image: ghcr.io/karpeleslab/fullrust:latest
    steps:
      - uses: actions/checkout@v6

      - name: Create a real proc-macro crate
        run: |
          mkdir -p probe/src
          # `[workspace]` makes probe its own workspace root, so cargo does not walk
          # up into this repo's workspace (a test artifact — real consumers build at
          # their own repo root). Harmless for the composite job (it mounts only probe).
          printf '[package]\nname = "probe"\nversion = "0.0.0"\nedition = "2021"\n\n[[bin]]\nname = "probe"\npath = "src/main.rs"\n\n[dependencies]\nserde = { version = "1", features = ["derive"] }\nserde_json = "1"\n\n[workspace]\n' > probe/Cargo.toml
          printf 'use serde::Serialize;\n#[derive(Serialize)]\nstruct P { msg: &%sstatic str }\nfn main() { println!("{}", serde_json::to_string(&P { msg: "built by the fullrust action" }).unwrap()); }\n' "'" > probe/src/main.rs

      # No `uses: ./` here — the image env (RUSTC / CARGO_BUILD_TARGET / CARGO_HOME
      # with the ecosystem [patch] / RUSTC_BOOTSTRAP) already makes plain cargo a
      # fullrust build. This is exactly what a `container:` job consumer gets.
      - name: Raw cargo build (baked env → fullrust target)
        working-directory: probe
        run: cargo build --release

      - name: Assert static, libc-free, and runs
        working-directory: probe
        run: |
          set -euxo pipefail
          bin=target/x86_64-unknown-linux-fullrust/release/probe
          test -f "$bin"
          if readelf -l "$bin" | grep -qi interp; then echo "::error::dynamic (has PT_INTERP)"; exit 1; fi
          if readelf -d "$bin" 2>/dev/null | grep -qi needed; then echo "::error::has NEEDED deps"; exit 1; fi
          out="$(./"$bin")"
          echo "ran → $out"
          [ "$out" = '{"msg":"built by the fullrust action"}' ]
