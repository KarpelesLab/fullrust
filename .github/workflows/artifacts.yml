name: Static artifacts (demo)

# Demonstrates the reusable action (./action.yml): build an unmodified crate
# into a pure libc-free static binary and upload it. Reference for users.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # upload-artifact needs read; attaching release assets needs write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create an unmodified demo crate
        run: |
          mkdir -p /tmp/demo/src
          cat > /tmp/demo/Cargo.toml <<'EOF'
          [package]
          name = "demo"
          version = "0.1.0"
          edition = "2021"
          EOF
          cat > /tmp/demo/src/main.rs <<'EOF'
          fn main() {
              println!("a pure, libc-free static binary, built by a GitHub Action");
          }
          EOF

      - name: Build it (zero-touch)
        uses: ./
        with:
          working-directory: /tmp/demo
          args: --release

      - name: Show it is libc-free
        run: |
          BIN=/tmp/demo/target/x86_64-fullrust-linux/release/demo
          file "$BIN"
          ldd "$BIN" || true
          "$BIN"

      - name: Package as a .tar.gz
        run: |
          name="demo-x86_64-linux-static"
          mkdir -p "dist/$name"
          cp /tmp/demo/target/x86_64-fullrust-linux/release/demo "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-x86_64-fullrust-linux
          path: dist/demo-x86_64-linux-static.tar.gz
          if-no-files-found: error

      # On a tag, also attach the archive to the GitHub Release.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/demo-x86_64-linux-static.tar.gz
