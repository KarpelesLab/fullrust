name: fullrust toolchain

# Build the patched stage1 compiler and attach it (with the bootstrap cargo) as a
# release asset. This is the slow, rare half (LLVM + rustc from source, ~1–2 h);
# the fast `fullrust image` workflow packages the asset into a container. Run it
# once per Rust version. Analogous to decryptd's Release workflow producing the
# binary that its Docker workflow then ships.

on:
  workflow_dispatch:
    inputs:
      minor:
        description: "Rust minor to build (e.g. 1.88)"
        required: true
        default: "1.88"
        type: string
      publish:
        description: "Publish the toolchain release asset (untick to only build + test)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write        # create/update the toolchain release + upload the asset
  actions: write         # dispatch `fullrust image` for the freshly published minor

jobs:
  build:
    name: build stage1 (${{ inputs.minor }})
    # Pinned, not ubuntu-latest: the host rustc/cargo produced here link the
    # runner's glibc/libstdc++ (GLIBC_2.39 / GLIBCXX_3.4.32 on 24.04). The image
    # (docker/Dockerfile) bases on debian:trixie to satisfy exactly that floor;
    # letting the runner drift to a newer Ubuntu would raise it and break the image.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 cmake ninja-build clang git build-essential

      # Restore/save split (not `actions/cache`) so the build is cached as soon
      # as it succeeds — even if the test step below then fails, a re-run after
      # a std-only fix rebuilds incrementally instead of from scratch.
      - name: Restore toolchain build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: toolchain/rust-${{ inputs.minor }}/build
          key: fullrust-build-${{ inputs.minor }}-${{ hashFiles(format('toolchain/patches/fullrust-{0}.patch', inputs.minor), format('toolchain/bootstrap-{0}.toml', inputs.minor)) }}
          restore-keys: fullrust-build-${{ inputs.minor }}-

      - name: Build the fullrust toolchain
        working-directory: toolchain
        run: ./build-fork.sh "${{ inputs.minor }}.0"

      # Saved even when the build step fails (e.g. a new version's overlay not
      # compiling yet): LLVM + the compiler are the 1–2 h part, and keeping them
      # makes the fix-and-rerun loop incremental via the restore-keys prefix.
      - name: Save toolchain build cache
        if: ${{ !cancelled() && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: toolchain/rust-${{ inputs.minor }}/build
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # Gate publishing on the built toolchain actually producing working
      # binaries: build + run the core test crates on this (Linux) runner.
      - name: Run test crates
        working-directory: toolchain
        run: ./run-tests.sh "${{ inputs.minor }}"

      - name: Package stage1 + cargo
        if: inputs.publish
        working-directory: toolchain
        run: ./docker/package-toolchain.sh "${{ inputs.minor }}" "$GITHUB_WORKSPACE/fullrust-toolchain-${{ inputs.minor }}-x86_64.tar.gz"

      - name: Publish toolchain release asset
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: toolchain-${{ inputs.minor }}
          name: fullrust toolchain ${{ inputs.minor }}
          files: fullrust-toolchain-${{ inputs.minor }}-x86_64.tar.gz
          body: |
            Prebuilt fullrust stage1 toolchain (rustc with the built-in
            `x86_64-unknown-linux-fullrust` target + host & fullrust sysroots +
            rust-lld) and the bootstrap cargo, for Rust ${{ inputs.minor }}.
            Consumed by the `fullrust image` workflow to build
            `ghcr.io/${{ github.repository_owner }}/fullrust`.

      # A new toolchain asset is useless until it's in the image — rebuild that
      # minor's image now rather than relying on someone remembering to.
      - name: Rebuild this minor's image
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run fullrust-image.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f minor="${{ inputs.minor }}"
