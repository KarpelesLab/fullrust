name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (library crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p fullrust -p fullrust-std -p cargo-fullrust -- -D warnings

  build-stable:
    name: Build (stable, precompiled core/alloc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build all examples (libc-free static)
        run: ./x build
      - name: Run hello and assert it is libc-free
        run: |
          BIN=target/x86_64-unknown-linux-gnu/debug/hello
          out=$("$BIN"); echo "$out"
          test "$out" = "hello from libc-free rust"
          ldd "$BIN" 2>&1 | grep -q "not a dynamic executable"
          test "$(readelf -d "$BIN" 2>/dev/null | grep -c NEEDED)" -eq 0

  build-nightly:
    name: Build (nightly, build-std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Build all examples (build-std, release)
        run: ./x build --nightly --release
      - name: Run offline examples
        run: |
          B=target/x86_64-fullrust-linux/release
          ./$B/hello
          ./$B/alloc-demo
          # `args` exits with code = argc by design, and panic-demo aborts (134),
          # so they are built but not run here. std-smoke does live DNS/TCP
          # (flaky in CI), so it is built but run only locally.

  cargo-subcommand:
    name: cargo fullrust (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Build the cargo subcommand (host tool)
        run: cargo build -p cargo-fullrust
      - name: Zero-touch — build an UNMODIFIED crate (plain fn main, no deps)
        run: |
          export PATH="$PWD/target/debug:$PATH"
          export FULLRUST_DEV_REPO="$PWD"   # sysroot uses the in-repo crates
          cargo fullrust build -p plain
          out=$(target/x86_64-fullrust-linux/debug/plain | head -1); echo "$out"
          test "$out" = "brown: 1"
          ldd target/x86_64-fullrust-linux/debug/plain 2>&1 | grep -q "not a dynamic executable"
      - name: Runtime mode — explicit entry! crate still builds
        run: |
          export PATH="$PWD/target/debug:$PATH"
          cargo fullrust build --runtime -p hello
          out=$(target/x86_64-fullrust-linux/debug/hello); echo "$out"
          test "$out" = "hello from libc-free rust"
      - name: Threads + sync + TLS (zero-touch, unmodified crate)
        run: |
          export PATH="$PWD/target/debug:$PATH"
          export FULLRUST_DEV_REPO="$PWD"
          mkdir -p /tmp/thr/src
          cat > /tmp/thr/Cargo.toml <<'EOF'
          [package]
          name = "thr"
          version = "0.0.0"
          edition = "2021"
          EOF
          cat > /tmp/thr/src/main.rs <<'EOF'
          use std::cell::Cell;
          use std::sync::{Arc, Condvar, Mutex};
          use std::thread;
          thread_local! { static N: Cell<u32> = Cell::new(0); }
          fn main() {
              // join + return values
              let hs: Vec<_> = (1u64..=4).map(|i| thread::spawn(move || i * i)).collect();
              assert_eq!(hs.into_iter().map(|h| h.join().unwrap()).sum::<u64>(), 30);
              // Arc<Mutex> contention
              let c = Arc::new(Mutex::new(0u64));
              let ts: Vec<_> = (0..8).map(|_| { let c = c.clone();
                  thread::spawn(move || for _ in 0..1000 { *c.lock().unwrap() += 1; }) }).collect();
              for t in ts { t.join().unwrap(); }
              assert_eq!(*c.lock().unwrap(), 8000);
              // Condvar
              let pair = Arc::new((Mutex::new(false), Condvar::new()));
              let p2 = pair.clone();
              let w = thread::spawn(move || { let (l, cv) = &*p2;
                  let mut r = l.lock().unwrap(); while !*r { r = cv.wait(r).unwrap(); } });
              { let (l, cv) = &*pair; *l.lock().unwrap() = true; cv.notify_one(); }
              w.join().unwrap();
              // per-thread TLS
              N.with(|c| c.set(100));
              let child = thread::spawn(|| { N.with(|c| c.set(7)); N.with(|c| c.get()) }).join().unwrap();
              assert_eq!(N.with(|c| c.get()), 100);
              assert_eq!(child, 7);
              println!("threads+sync+tls OK");
          }
          EOF
          ( cd /tmp/thr && cargo fullrust build --release )
          out=$(/tmp/thr/target/x86_64-fullrust-linux/release/thr); echo "$out"
          test "$out" = "threads+sync+tls OK"
