[package]
name = "osunix-fullrust"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "osunix-fullrust"
path = "src/main.rs"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("fullrust"))'] }
