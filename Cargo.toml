[workspace]
resolver = "2"
members = [
    "crates/fullrust",
    "crates/fullrust-std",
    "examples/hello",
    "examples/args",
    "examples/alloc-demo",
    "examples/panic-demo",
    "examples/std-smoke",
]

# panic=abort is mandatory: it removes the unwinding landing pads that would
# otherwise reference _Unwind_Resume / rust_eh_personality. See README.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true
