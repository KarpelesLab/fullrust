[workspace]
resolver = "2"
members = [
    "crates/fullrust",
    "crates/fullrust-std",
    "crates/cargo-fullrust",
    "examples/hello",
    "examples/args",
    "examples/alloc-demo",
    "examples/panic-demo",
    "examples/std-smoke",
    "examples/plain",
]
# cargo-fullrust is a host tool (ordinary std binary); exclude it from the
# default set so `./x build` / `cargo fullrust build` (freestanding target) don't
# try to build it for a libc-free target. Build it with `cargo build -p
# cargo-fullrust` or install it with `cargo install cargo-fullrust`.
# std-smoke is excluded: it uses thread_local! (needs nightly feature(thread_local),
# injected by ./x --nightly) and does live network I/O, so it's a manual/nightly
# example: `./x run --nightly -p std-smoke`.
default-members = [
    "crates/fullrust",
    "crates/fullrust-std",
    "examples/hello",
    "examples/args",
    "examples/alloc-demo",
    "examples/panic-demo",
]

# panic=abort is mandatory: it removes the unwinding landing pads that would
# otherwise reference _Unwind_Resume / rust_eh_personality. See README.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true
