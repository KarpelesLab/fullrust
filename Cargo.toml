[workspace]
resolver = "2"
# The toolchain/ directory holds out-of-tree Rust source checkouts (the fork we
# build the libc-free target into); keep them out of this Cargo workspace.
exclude = ["toolchain"]
members = [
    "crates/fullrust",
    "crates/cargo-fullrust",
    "examples/hello",
    "examples/args",
    "examples/alloc-demo",
    "examples/panic-demo",
    "examples/std-smoke",
    "examples/plain",
]
# cargo-fullrust is a host tool (ordinary std binary); exclude it from the
# default set so `./x build` / `cargo fullrust build` (freestanding target) don't
# try to build it for a libc-free target. Build it with `cargo build -p
# cargo-fullrust` or install it with `cargo install cargo-fullrust`.
# std-smoke is excluded from the default set too: it does live DNS/TCP (flaky in
# CI), so it is a manual example — `./x run -p std-smoke` (purestd net + time +
# threads over raw syscalls).
default-members = [
    "crates/fullrust",
    "examples/hello",
    "examples/args",
    "examples/alloc-demo",
    "examples/panic-demo",
]

# panic=abort is mandatory: it removes the unwinding landing pads that would
# otherwise reference _Unwind_Resume / rust_eh_personality. See README.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true
