# release-plz configuration.
#
# Only the two library crates are published to crates.io; every crate under
# examples/ is `publish = false` and is skipped automatically. release-plz
# resolves the intra-workspace order itself (fullrust is published before
# fullrust-std, which depends on it).

[workspace]
# Create a GitHub Release for each published crate version.
git_release_enable = true
# Keep a CHANGELOG.md per crate, generated from conventional commits.
changelog_update = true
