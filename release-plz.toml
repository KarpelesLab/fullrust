# release-plz configuration.
#
# The published crates are `fullrust` (the runtime) and `cargo-fullrust` (the
# build tool); the standard library is a separate crate, `purestd`. Everything
# under examples/ is `publish = false` and is skipped automatically.

[workspace]
# Create a GitHub Release for each published crate version.
git_release_enable = true
# Keep a CHANGELOG.md per crate, generated from conventional commits.
changelog_update = true
